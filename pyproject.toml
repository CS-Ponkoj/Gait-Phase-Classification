[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gait-phase-research"
version = "0.1.0"
description = "Reproducible four-phase gait classification research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib==3.8.0",
  "numpy==1.24.3",
  "pandas==2.2.0",
  "Pillow==10.1.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
ml = [
  "torch==2.5.1",
  "torchvision==0.20.1",
]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
gait-phase = "gait_phase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
