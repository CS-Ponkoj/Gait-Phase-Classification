study:
  name: casia_four_phase_pooled
  seed: 20260827
  labels:
    - initial_contact_loading
    - mid_stance
    - terminal_stance_preswing
    - swing
  excluded_datasets:
    - ou_isir_treadmill_b

data:
  casia_a_root: legacy/training_workspace/dataset_a
  casia_c_root: data/raw/casia_c
  manifest: data/manifests/generated/casia_a_c_manifest.csv
  image_size: [128, 128]
  test_subject_fraction: 0.20
  development_folds: 5
  annotation_kappa_threshold: 0.80

training:
  batch_size: 32
  epochs: 30
  early_stopping_patience: 5
  learning_rate: 0.001
  temporal_window: 9
  class_weighting: balanced
  augmentation: true

evaluation:
  primary_metric: subject_macro_f1
  bootstrap_iterations: 2000
  confidence_level: 0.95

annotation_pilot:
  version: pilot_v3
  output: annotations/pilot/pilot_v3
  casia_c_sequences_per_family: 3
  excluded_sequence_ids:
    - casia_c:150:fn03
    - casia_c:147:fn01
  gif_duration_ms: 120

auto_annotation:
  version: v0.1-ai
  output: annotations/provisional/v0.1-ai
  expected_step_frames:
    fn: 13
    fs: 16
    fq: 12
    fb: 13

prepared_data:
  output: data/processed/provisional_v0.1-ai
  labels: annotations/provisional/v0.1-ai/frame_labels.csv.gz
  confidence: medium
  folds: 5
  copy_workers: 16
  expected_counts:
    development_frames: 78021
    test_frames: 19992
    withheld_low_confidence_frames: 2317
    copied_files: 410097
    folds:
      0: {train_frames: 62196, validation_frames: 15825}
      1: {train_frames: 61478, validation_frames: 16543}
      2: {train_frames: 62509, validation_frames: 15512}
      3: {train_frames: 63261, validation_frames: 14760}
      4: {train_frames: 62640, validation_frames: 15381}
